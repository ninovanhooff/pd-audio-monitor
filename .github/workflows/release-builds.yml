name: Release builds

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# A macOS runner bills at ten times a Linux one, so a superseded run should stop costing. Each release
# has a tag ref of its own and so never cancels another.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-host:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: usb-stream/host
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install numpy pyserial sounddevice pyinstaller
      - run: >
          gcc -std=c11 -O2 -Wall -Wextra -shared -static-libgcc -I../../shared/codec -o libpdstream.dll
          encoder.c ../../shared/codec/format_stream.c ../../shared/codec/format_chain.c ../../shared/codec/ima_adpcm.c
      - run: python -m PyInstaller --noconfirm --log-level WARN --workpath build/app --distpath dist host.spec
      - run: 7z a "PD-Audio-Monitor-Host-${GITHUB_REF_NAME}-windows-x64.zip" "./dist/PD Audio Monitor Host.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: PD-Audio-Monitor-Host-windows-x64
          path: usb-stream/host/PD-Audio-Monitor-Host-*-windows-x64.zip
      - if: startsWith(github.ref, 'refs/tags/')
        run: gh release upload "$GITHUB_REF_NAME" PD-Audio-Monitor-Host-*-windows-x64.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  macos-host:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        working-directory: usb-stream/host
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install numpy pyserial sounddevice pyinstaller
      - run: make app
      - run: ditto -c -k --keepParent "dist/PD Audio Monitor Host.app" "PD-Audio-Monitor-Host-${GITHUB_REF_NAME}-macos-arm64.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: PD-Audio-Monitor-Host-macos-arm64
          path: usb-stream/host/PD-Audio-Monitor-Host-*-macos-arm64.zip
      - if: startsWith(github.ref, 'refs/tags/')
        run: gh release upload "$GITHUB_REF_NAME" PD-Audio-Monitor-Host-*-macos-arm64.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  receiver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: 13.2.Rel1
      - name: Install the Playdate SDK
        run: |
          curl -fsSL https://download.panic.com/playdate_sdk/Linux/PlaydateSDK-latest.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "PLAYDATE_SDK_PATH=$(echo "$RUNNER_TEMP"/PlaydateSDK-*)" >> "$GITHUB_ENV"
      - run: make -C usb-stream/receiver
      - run: zip -r "PDAudioMonitorReceiver-${GITHUB_REF_NAME}.pdx.zip" PDAudioMonitorReceiver.pdx
        working-directory: usb-stream/receiver
      - uses: actions/upload-artifact@v7
        with:
          name: PDAudioMonitorReceiver
          path: usb-stream/receiver/PDAudioMonitorReceiver-*.pdx.zip
      - if: startsWith(github.ref, 'refs/tags/')
        run: gh release upload "$GITHUB_REF_NAME" PDAudioMonitorReceiver-*.pdx.zip --clobber
        working-directory: usb-stream/receiver
        env:
          GH_TOKEN: ${{ github.token }}
